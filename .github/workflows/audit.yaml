name: Audit

on:
  pull_request:
  schedule:
    - cron: '0 9 * * 1'  # At 09 UTC on Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6.2.0
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: requirements-audit.txt

      - name: Install pip-audit
        run: pip install --requirement requirements-audit.txt

      - name: Audit dependencies
        run: pip-audit --requirement requirements.txt --requirement requirements-dev.txt
