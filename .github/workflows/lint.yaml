name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install linting tools and runtime dependencies
        run: pip install --requirement requirements-dev.txt

      - name: ruff format
        run: ruff format --check .

      - name: ruff check
        run: ruff check --output-format github .

      - name: Register problem matchers
        run: |
          echo "::add-matcher::.github/problem-matchers/bandit.json"
          echo "::add-matcher::.github/problem-matchers/mypy.json"
          echo "::add-matcher::.github/problem-matchers/pylint.json"

      - name: bandit
        run: |
          bandit -r src/ -c bandit.yaml -q -f custom --msg-template "{relpath}:{line}:{col}: {test_id}: {msg}"

      - name: mypy
        run: mypy src/ tests/

      - name: pylint
        run: PYTHONPATH=src pylint src/ tests/
