name: Publish

on:
  push:
    tags:
      # Intentionally support only a subset of Semantic Versioning
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate tag matches pyproject.toml version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(grep '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - uses: actions/setup-python@v6.2.0
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-audit.txt

      - name: Install dependencies
        run: pip install --requirement requirements-dev.txt

      # test.yaml, lint.yaml, and audit.yaml only trigger on PRs and pushes to
      # main — not on tags. Re-running them here ensures the image is never
      # published from code that hasn't passed CI.
      - name: Install pip-audit
        run: pip install --requirement requirements-audit.txt

      - name: Audit dependencies
        run: pip-audit --requirement requirements.txt --requirement requirements-dev.txt

      - name: Run tests
        run: python3 -m pytest --verbose

      - name: Register problem matchers
        run: |
          echo "::add-matcher::.github/problem-matchers/bandit.json"
          echo "::add-matcher::.github/problem-matchers/mypy.json"
          echo "::add-matcher::.github/problem-matchers/pylint.json"

      - name: Run lint
        run: |
          ruff format --check .
          ruff check --output-format github .
          bandit -r src/ -c bandit.yaml -q -f custom --msg-template "{relpath}:{line}:{col}: {test_id}: {msg}"
          mypy src/ tests/
          PYTHONPATH=src pylint src/ tests/

      - name: Read Python version
        run: echo "PYTHON_VERSION=$(cat .python-version)" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to image registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.IMAGE_REGISTRY }}
          username: ${{ secrets.IMAGE_REGISTRY_USER }}
          password: ${{ secrets.IMAGE_REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.IMAGE_REGISTRY }}/${{ vars.IMAGE_REGISTRY_NAMESPACE }}/${{ github.event.repository.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PYTHON_VERSION=${{ env.PYTHON_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
